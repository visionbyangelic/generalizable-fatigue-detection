model: EEGNet-8,2 (kernel 64 @128 Hz)
input: '6 channels: 4 EEG + mask_TP9 + mask_TP10 indicator planes'
validation: 'SEGMENT-GROUPED: whole run-segments carved from training sessions, 2-window
  purge at boundaries'
channel_dropout: temporal channels dropped p=0.2 per sample per batch during training
  (EEG zeroed + indicator plane set to 0)
training: Adam lr=0.001, batch=64, max_epochs=100, early stopping patience=15 on segment-grouped
  validation loss
class_weights: subtraining-fold balanced
normalisation: per-EEG-channel mean/SD from subtraining fold only
protocol: within (segment-grouped validation)
labels: subjective (Amendment 1 windows)
cap_seed: 0
model_seed: 1
feasibility: validation both classes and >=6 windows; subtrain both classes and >=20
  windows after purge
seed_note: REDUCED seed set {0,1}; full LOSO x 5 seeds = Weeks 3-4 on Colab
