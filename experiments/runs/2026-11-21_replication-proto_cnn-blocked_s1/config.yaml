model: EEGNet CNN (frozen cnn.py train_fold)
features/input: raw stream windows, 6 channels (4 EEG + constant-1 mask indicator
  planes), EEGNet-8,2
protocol: 'RQ4 prototype-faithful replication (POST HOC, panel-owed): Subject 01 only,
  day-level labels (whole Session 01 = alert, whole Session 03 = fatigued), prototype
  windowing (4 s windows, 2 s stride, whole-stream epoching, 1,353 windows)'
split: 'blocked split: consecutive 30-window blocks within each session, every fifth
  block = test, the rest train, with training windows that share samples with a test
  window purged (overlap removed, recording still shared)'
seed: model seed 1
data: windows_proto_p01 (this run's window build; see the driver docstring for the
  count check and the named preprocessing departures)
git_commit: 2e2f308
blocked_purge_n: 16
torch: 2.15.0+cpu
